<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>BARISTA LAB</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin="anonymous"><link rel="stylesheet" href="app-v61.css"></head><body><main><header><div><small>BARISTA LAB / TRAINING</small><h1>오늘의 카페</h1></div><span class="tag">v6.1 · 모바일</span></header><div id="notice" role="status"></div><section id="setup" class="panel"><h2>나만의 레시피로 시작</h2><p>레시피 JSON 파일을 선택하면 이 기기에 저장됩니다. 서버로 전송하지 않습니다.</p><label class="file">레시피 불러오기<input id="file" type="file" accept=".json,application/json"></label><p class="sub">아이폰: 홈 화면에 추가한 앱에서 처음 불러오는 것을 권장합니다.</p></section><div id="app" hidden><div class="stats" id="stats"></div><nav id="nav"><button data-tab="game" class="active">제조</button><button data-tab="book">도감</button><button data-tab="wrong">오답</button><button data-tab="settings">설정</button></nav><section id="game"><div class="panel filters"><select id="category" aria-label="메뉴 분류"></select><select id="mode" aria-label="연습 모드"><option value="strict">실전 순서</option><option value="easy">재료·용량</option><option value="timed">45초 타임어택</option></select></div><div id="gamebody"></div></section><section id="book" hidden></section><section id="wrong" hidden></section><section id="settings" hidden class="panel"><h2>개인 데이터</h2><p>레시피와 학습 기록은 이 브라우저에만 보관됩니다.</p><label class="file">레시피 교체<input id="replace" type="file" accept=".json,application/json"></label><button id="export">레시피 파일 내보내기</button><button id="backup">학습 기록 포함 백업</button><button id="reset">학습 기록 초기화</button><button id="erase">모든 개인 데이터 삭제</button><details><summary>레시피 직접 수정 (JSON)</summary><textarea id="editor" rows="12" spellcheck="false"></textarea><button id="editSave">수정 저장</button></details></section></div><footer>레시피는 기기 내부 저장 · 인터넷 없이 연습 가능 (최초 온라인 실행 후)</footer></main><script src="app-v61.js"></script></body></html>
